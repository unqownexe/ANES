<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANES Browser Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M3 12h18M12 3c3 3.4 3 14.6 0 18M12 3c-3 3.4-3 14.6 0 18"
              fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </div>
    <div>
      <h1>ANES Browser Agent</h1>
      <p class="sub">Spotlight AI tarayıcı köprüsü</p>
    </div>
  </header>

  <section class="status">
    <div class="status-row">
      <span id="dot" class="dot off"></span>
      <strong id="statusTitle">ANES kapalı</strong>
    </div>
    <p id="statusText" class="status-text">
      ANES'i açın ve Ayarlar &gt; AI &gt; Tarayıcı Kontrolü'nü etkinleştirin.
    </p>
  </section>

  <section class="card">
    <div class="row"><span>Görev</span><b id="taskText">Yok</b></div>
    <div class="row"><span>Aktif sekme</span><b id="tabText">—</b></div>
    <div class="row"><span>Eklenti kimliği</span><b id="idText" class="mono">—</b></div>
  </section>

  <div class="actions">
    <button id="reconnect" class="primary" type="button">Yeniden bağlan</button>
    <button id="options" type="button">Ayrıntılar</button>
  </div>

  <p class="foot">Bu eklenti yalnız yerel ANES uygulamasıyla konuşur; internete veri göndermez.</p>
  <script src="popup.js"></script>
</body>
</html>
